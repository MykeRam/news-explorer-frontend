# Install as /etc/nginx/sites-available/news-explorer-frontend.
# Enable HTTP first; Certbot adds HTTPS after DNS points at this VM.
server {
    listen 80;
    listen [::]:80;
    server_name news-explorer-mykeram.mooo.com;

    root /var/www/news-explorer-frontend/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }
}
